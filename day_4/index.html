<!doctype html>
<html>
  <head>
    <title>Practice Conditional Statement</title>
    <meta charset="UTF-8" />
  </head>
  <body>
    <script>
      let num = prompt("Enter a number: ");

      if (num % 2 == 0) document.write(num + " is an even number");
      else document.write(num + " is an odd number");
    </script>
  </body>
</html>
